<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-do list</title>

    <!-- ! bootstrap css file -->
    <link rel="stylesheet" href="css/bootstrap.min.css">

    <!-- ! css file -->
    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <div class="container-fluid px-5">
        <div class="row ">
            <div class="col-md-10 mx-auto">
                <h1 class="text-center text-success font-weight-bolder mt-5 pt-5">To-Do list</h1>


                <form id="taskForm" action="#" class="mt-4">
                    <input id="taskPlace" type="text" placeholder="Enter Your Task" class="form-control" autofocus>

                    <input type="submit" class="btn btn-block btn-success mt-4" value="Enter">
                </form>

                <ul id="tasks" class="w-100 list-unstyled  mt-4 d-flex flex-wrap ">




                </ul>


            </div>
        </div>
    </div>












    <script src="js/jquery.slim.min.js"></script>
    <script src="js/popper.min.js"></script>
    <script src="js/bootstrap.min.js"></script>


    <!-- ! js file  -->
    <script src="js/main.js"></script>
</body>

</html>
